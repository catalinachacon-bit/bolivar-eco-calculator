<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolívar Eco-Calculator</title>

  <style>
    :root {
      color-scheme: light;
      --texto: #12372a;
      --texto-secundario: #426457;
      --esmeralda: #047857;
      --esmeralda-oscuro: #065f46;
      --borde: #658878;
      --foco: #075985;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--texto);
      background: radial-gradient(ellipse at top, #d1fae5, transparent 65%),
        #f4faf6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 45rem;
      margin-inline: auto;
      padding: clamp(2rem, 7vw, 4rem) clamp(1rem, 4vw, 2rem) 2rem;
    }

    h1 {
      margin: 0 0 clamp(1.25rem, 4vw, 2rem);
      color: var(--esmeralda-oscuro);
      font-size: clamp(1.8rem, 6vw, 3rem);
      line-height: 1.12;
      text-align: center;
      text-wrap: balance;
    }

    #formulario-ambiental {
      display: grid;
      gap: 1.25rem;
      padding: clamp(1.25rem, 5vw, 2rem);
      border: 1px solid #d1e8dc;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 12px 32px rgb(6 95 70 / 10%);
    }

    #formulario-ambiental p {
      display: grid;
      gap: 0.4rem;
      min-width: 0;
      margin: 0;
    }

    #formulario-ambiental label {
      font-weight: 650;
    }

    #formulario-ambiental :is(select, input, button) {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--borde);
      border-radius: 0.65rem;
      font: inherit;
    }

    #formulario-ambiental :is(select, input) {
      color: var(--texto);
      background: #f7fcf9;
    }

    #formulario-ambiental button {
      border-color: var(--esmeralda);
      color: #fff;
      background: var(--esmeralda);
      font-weight: 700;
      cursor: pointer;
    }

    #formulario-ambiental button:hover {
      border-color: var(--esmeralda-oscuro);
      background: var(--esmeralda-oscuro);
    }

    #formulario-ambiental :is(select, input, button):focus-visible {
      outline: 3px solid var(--foco);
      outline-offset: 3px;
    }

    #resultado {
      margin: 0;
      overflow-wrap: anywhere;
    }

    #resultado:not(:empty) {
      margin-block-start: 1rem;
      padding: 1.1rem 1.25rem;
      border: 1px solid #a7e5c7;
      border-inline-start: 0.3rem solid var(--esmeralda);
      border-radius: 0.85rem;
      color: var(--esmeralda-oscuro);
      background: #e7f8ee;
      font-size: 1.0625rem;
      font-weight: 700;
    }

    main > p:last-child:not(#resultado) {
      margin: 0.9rem 0 0;
      color: var(--texto-secundario);
      font-size: 0.875rem;
    }

    @media (min-width: 38rem) {
      #formulario-ambiental {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #formulario-ambiental p:first-child,
      #formulario-ambiental button {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Bolívar Eco-Calculator</h1>

    <form id="formulario-ambiental">
      <p>
        <label for="transporte">Medio de transporte al colegio</label>
        <select id="transporte" name="transporte" required>
          <option value="">Selecciona una opción</option>
          <option value="bus">Bus</option>
          <option value="privado">Carro privado</option>
          <option value="compartido">Carro compartido</option>
          <option value="activo">Bicicleta/Caminando</option>
        </select>
      </p>

      <p>
        <label for="hojas">Hojas de papel usadas al día</label>
        <input id="hojas" name="hojas" type="number" min="0" step="1" required>
      </p>

      <p>
        <label for="reciclaje">Nivel de reciclaje</label>
        <select id="reciclaje" name="reciclaje" required>
          <option value="">Selecciona una opción</option>
          <option value="bajo">Bajo</option>
          <option value="medio">Medio</option>
          <option value="alto">Alto</option>
        </select>
      </p>

      <button type="submit">Calcular</button>
    </form>

    <p id="resultado" role="status" aria-atomic="true"></p>
    <p>La estimación usa factores ilustrativos y supone cinco días escolares por semana.</p>
  </main>

  <script>
    const diasEscolares = 5;
    const kgPorHoja = 0.005;

    // Factores ilustrativos en kg de CO₂ por estudiante y día, con ida y vuelta.
    const opcionesTransporte = {
      bus: { kgPorDia: 0.8, puntos: 30 },
      privado: { kgPorDia: 2, puntos: 0 },
      compartido: { kgPorDia: 1, puntos: 20 },
      activo: { kgPorDia: 0, puntos: 40 }
    };

    // En este modelo, el nivel de reciclaje reduce solo la huella del papel.
    const opcionesReciclaje = {
      bajo: { reduccionPapel: 0, puntos: 0 },
      medio: { reduccionPapel: 0.15, puntos: 15 },
      alto: { reduccionPapel: 0.30, puntos: 30 }
    };

    const formulario = document.getElementById("formulario-ambiental");
    const resultado = document.getElementById("resultado");
    const formatoHuella = new Intl.NumberFormat("es-CO", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();

      const transporte = opcionesTransporte[formulario.elements.transporte.value];
      const hojasPorDia = formulario.elements.hojas.valueAsNumber;
      const reciclaje = opcionesReciclaje[formulario.elements.reciclaje.value];

      // Huella semanal = 5 × (transporte diario + huella diaria del papel ajustada).
      const huellaPapelDiaria = hojasPorDia * kgPorHoja * (1 - reciclaje.reduccionPapel);
      const huellaSemanal = diasEscolares * (transporte.kgPorDia + huellaPapelDiaria);

      // Hasta 40 puntos por transporte, 30 por papel y 30 por reciclaje.
      // El papel empieza en 30 puntos y pierde 2 por cada hoja usada al día.
      const puntosPapel = Math.max(0, 30 - 2 * hojasPorDia);
      const ecoPoints = transporte.puntos + puntosPapel + reciclaje.puntos;

      resultado.textContent =
        `Huella semanal estimada: ${formatoHuella.format(huellaSemanal)} kg de CO₂. ` +
        `Eco-Points: ${ecoPoints} de 100.`;
    });
  </script>
</body>
</html>
